<html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>basketball Scoreboard</title>
        <link rel="icon" type="image/png" href="/favicon.png">
        
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="scoreboard">
            <button class="score-button" id="new-game-btn" onclick="reset()">New Game</button>
            <div class="scores">
                <div class="score-card">
                    <p class="score-text">HOME</p>
                    <div class="display" id="home-score">0</div>
                    <div class="score-buttons">
                        <button class="score-button" onclick="add1home()">+1</button>
                        <button class="score-button" onclick="add2home()">+2</button>
                        <button class="score-button" onclick="add3home()">+3</button>
                    </div>
                </div>
                <div class="score-card" id="timer">
                    <p class="score-text" id="timer-txt">TIMER</p>
                    <div class="display" id="clock">20:00</div>
                    <button class="score-button" id="start-btn" onclick="toggleTimer()">START</button>
                </div> 
                <div class="score-card">
                    <p class="score-text">GUEST</p>
                    <div class="display" id="guest-score">0</div>
                    <div class="score-buttons">
                        <button class="score-button" onclick="add1guest()">+1</button>
                        <button class="score-button" onclick="add2guest()">+2</button>
                        <button class="score-button" onclick="add3guest()">+3</button>
                    </div>
                </div>
            </div>
            <div class="scores">
                <div class="score-card" id="fouls">
                    <p class="score-text">FOULS</p>
                    <div class="display" id = "foul-count">0</div>
                    <button class="score-button" id="foul-btn" onclick="add1foul()">ADD</button>
                </div>
                <div class="score-card" id="Periods">
                    <p class="score-text">Period</p>
                    <div class="display" id = "period-count">0</div>
                    <button class="score-button" id="period-btn" onclick="add1period()">ADD</button>
                </div>
            </div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
